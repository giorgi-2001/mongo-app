name: CI/CD pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt pytest pytest-cov flake8

      - name: Run Flake8
        working-directory: app
        run: python -m flake8 --max-line-length=120 src tests

      - name: Run pytest
        run: python -m pytest app/tests -q --cov=app/src --cov-report=term-missing
        env:
          PYTHONPATH: .

  publish-images:
    name: Build and publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mongo-app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app:${{ github.sha }}

      - name: Build and push mongo-app-ui
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app-ui:${{ github.sha }}

  release-images:
    name: Update image tags in helm repo
    runs-on: ubuntu-latest
    needs: publish-images 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      MONGO_APP_TAG: ${{ github.sha }}
      MONGO_APP_HELM_PATH: ${{ github.workspace }}/mongo-app-helm
      MONGO_APP_VALUES_PATH: ${{ github.workspace }}/mongo-app-helm/mongo-app/values.yaml
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4

      - name: Clone helm repo
        uses: actions/checkout@v4
        with:
          repository: giorgi-2001/mongo-app-helm
          token: ${{ secrets.HELM_REPO_PAT }}
          path: mongo-app-helm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Execute image tag update script
        run: python scripts/update_tags.py

      - name: Commit tag update
        run: |
          cd ${{ env.MONGO_APP_HELM_PATH }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "release: update tags to ${{ env.MONGO_APP_TAG }}"
          git status
          git push