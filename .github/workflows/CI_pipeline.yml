name: CI pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Python dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt pytest pytest-cov flake8

      - name: Run Flake8
        working-directory: app
        run: python -m flake8 --max-line-length=120 src tests

      - name: Run pytest
        working-directory: app
        run: python -m pytest -q --cov=src --cov-report=term-missing

  publish-images:
    name: Build and publish Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mongo-app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app:${{ github.sha }}

      - name: Build and push mongo-app-ui
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mongo-app-ui:${{ github.sha }}
