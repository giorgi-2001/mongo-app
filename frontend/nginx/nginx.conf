server {
    listen 80;
    server_name localhost;

    # Root directory pointing to the React build/dist output
    root /usr/share/nginx/html;
    index index.html;

    # 1. Serve static dist folder (React frontend)
    location / {
        # Tries to serve request as file, then as directory,
        # fallback to index.html for React client-side routing
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) aggressively
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Reverse proxy /api/v1 requests to internal Docker service
    location /api/v1/ {
        proxy_pass http://mongo-app:8000;

        # Standard headers for upstream application context
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (optional, but helpful for live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (adjust as needed for long-running endpoints)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Custom 50x page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}